# seed_everything: 42
trainer:
  accelerator: auto
  strategy: auto
  devices: auto
  num_nodes: 1
  precision: bf16-mixed
  logger:
  - class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      name: null
      save_dir: .
      version: null
      offline: false
      dir: null
      id: null
      anonymous: null
      project: clay-embedding-classifier
      log_model: false
      experiment: null
      prefix: ''
      checkpoint_name: null
      entity: ignaciomasari-eodc
      notes: null
      tags: null
      config: null
      config_exclude_keys: null
      config_include_keys: null
      allow_val_change: null
      group: null
      job_type: null
      mode: null
      force: null
      reinit: null
      resume: null
      resume_from: null
      fork_from: null
      save_code: null
      tensorboard: null
      sync_tensorboard: null
      monitor_gym: null
      settings: null
  callbacks:
  - class_path: lightning.pytorch.callbacks.ModelCheckpoint
    init_args:
      dirpath: checkpoints/segment_embeddings
      filename: embedding-7class-segment_epoch-{epoch:02d}_val-iou-{val/iou:.4f}
      monitor: val/iou
      verbose: true
      save_last: true
      save_top_k: 2
      save_on_exception: false
      save_weights_only: true
      mode: max
      auto_insert_metric_name: false
      every_n_train_steps: null
      train_time_interval: null
      every_n_epochs: null
      save_on_train_epoch_end: null
      enable_version_counter: true
  - class_path: lightning.pytorch.callbacks.EarlyStopping
    init_args:
      monitor: val/loss
      min_delta: 0.0
      patience: 10
      verbose: false
      mode: min
      strict: true
      check_finite: true
      stopping_threshold: null
      divergence_threshold: null
      check_on_train_epoch_end: null
      log_rank_zero_only: false
  - class_path: lightning.pytorch.callbacks.LearningRateMonitor
    init_args:
      logging_interval: step
      log_momentum: false
      log_weight_decay: false
  fast_dev_run: false
  max_epochs: 1
  min_epochs: null
  max_steps: -1
  min_steps: null
  max_time: null
  limit_train_batches: null
  limit_val_batches: null
  limit_test_batches: null
  limit_predict_batches: null
  overfit_batches: 0.0
  val_check_interval: null
  check_val_every_n_epoch: 1
  num_sanity_val_steps: 0
  log_every_n_steps: 5
  enable_checkpointing: null
  enable_progress_bar: null
  enable_model_summary: null
  accumulate_grad_batches: 1
  gradient_clip_val: null
  gradient_clip_algorithm: null
  deterministic: null
  benchmark: null
  inference_mode: true
  use_distributed_sampler: true
  profiler: null
  detect_anomaly: false
  barebones: false
  plugins:
  - class_path: lightning.pytorch.plugins.io.AsyncCheckpointIO
    init_args:
      checkpoint_io: null
  sync_batchnorm: false
  reload_dataloaders_every_n_epochs: 0
  default_root_dir: checkpoints/segment_embeddings
  model_registry: null
model:
  embedding_dim: 1024
  patch_size: 8
  target_size:
  - 224
  - 224
  hidden_dim: 512
  num_classes: 6
  lr: 1.0e-05
  wd: 0.05
  b1: 0.9
  b2: 0.95
  class_weights: null
data:
  train_embedd_dir: data/cvpr/ny/train/chips/embeddings/
  train_label_dir: data/cvpr/ny/train/labels/
  val_embedd_dir: data/cvpr/ny/val/chips/embeddings/
  val_label_dir: data/cvpr/ny/val/labels/
  test_embedd_dir: data/cvpr/ny/test/chips/embeddings/
  test_label_dir: data/cvpr/ny/test/labels/
  target_size:
  - 224
  - 224
  batch_size: 32
  num_workers: 8
optimizer: null
lr_scheduler: null
ckpt_path: null
