
# Model configuration - will be auto-filled with embedding dimensions
model:
  # These could be auto-detected from embeddings:
  embedding_dim: 1024
  patch_size: 8
  num_classes: 6
  target_size: [224, 224]  # Size of original images/labels
  hidden_dim: 512
  lr: 1e-5
  wd: 0.05
  b1: 0.9
  b2: 0.95

data:
  train_embedd_dir: data/cvpr/ny/train/chips/embeddings/
  train_label_dir: data/cvpr/ny/train/labels/
  val_embedd_dir: data/cvpr/ny/val/chips/embeddings/
  val_label_dir: data/cvpr/ny/val/labels/
  test_embedd_dir: data/cvpr/ny/test/chips/embeddings/
  test_label_dir: data/cvpr/ny/test/labels/
  target_size: [224, 224]
  batch_size: 32  
  num_workers: 8

trainer:
  accelerator: auto
  # strategy: ddp
  devices: auto
  precision: bf16-mixed
  log_every_n_steps: 5
  max_epochs: 1
  accumulate_grad_batches: 1
  default_root_dir: checkpoints/segment_embeddings
  fast_dev_run: False
  num_sanity_val_steps: 0

  logger:
    # - class_path: lightning.pytorch.loggers.WandbLogger
    #   init_args:
    #     entity: <your_wandb_entity>
    #     project: clay-embedding-classifier
    #     log_model: false
    - class_path: lightning.pytorch.loggers.CSVLogger
      init_args:
        save_dir: "lightning_logs"
        name: "clay-embedding-classifier"

  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints/segment_embeddings
        auto_insert_metric_name: False
        filename: 'embedding-7class-segment_epoch-{epoch:02d}_val-iou-{val/iou:.4f}'
        monitor: val/iou
        mode: max
        save_last: True
        save_top_k: 2
        save_weights_only: True
        verbose: True
    
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/loss
        patience: 10
        mode: min
    
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step

  plugins:
    - class_path: lightning.pytorch.plugins.io.AsyncCheckpointIO